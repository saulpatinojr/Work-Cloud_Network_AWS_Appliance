name: "340 · Sync Local Keys"
# Pulls all CNA platform secrets from AWS Secrets Manager and generates a
# populated .env file as a 1-day workflow artifact.
# Run this after infrastructure deployment to validate secrets are present
# and to provide a reference .env for local development or debugging.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

# One key-sync per environment at a time — overlapping runs would produce
# competing .env artifacts; a newer dispatch supersedes an in-flight one.
concurrency:
  group: sync-keys-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  sync-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Secrets Manager is IAM-gated, not IP-firewalled, so there is no runner
      # allow-list window to open and close here (the Azure version's Key Vault
      # steps). The secret names come from the runtime module:
      # <prefix>/{database-url,nextauth-secret,entra-client-secret,credential-encryption-key}.
      - name: Derive secret names from environment
        env:
          REGION_SHORT: ${{ vars.AWS_REGION_SHORT }}
        run: |
          if [ -z "$REGION_SHORT" ]; then
            echo "::error::AWS_REGION_SHORT repository variable is required (scripts/Initialize-CnaAwsGitHubSecrets.ps1 writes it)."
            exit 1
          fi
          echo "NAME_PREFIX=cna-${{ inputs.environment }}-${REGION_SHORT}" >> "$GITHUB_ENV"

      - name: Validate required Secrets Manager secrets exist
        run: |
          REQUIRED=(
            "${NAME_PREFIX}/database-url"
            "${NAME_PREFIX}/nextauth-secret"
            "${NAME_PREFIX}/entra-client-secret"
            "${NAME_PREFIX}/credential-encryption-key"
          )
          MISSING=()
          for secret in "${REQUIRED[@]}"; do
            if ! aws secretsmanager describe-secret --secret-id "$secret" --query 'ARN' --output text >/dev/null 2>&1; then
              MISSING+=("$secret")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing Secrets Manager secrets: ${MISSING[*]}"
            echo "Run workflow 210 · Deploy to create infrastructure and populate secrets."
            exit 1
          fi
          echo "All required secrets are present under ${NAME_PREFIX}/"

      - name: Pull secrets and generate .env
        run: |
          get_secret() {
            aws secretsmanager get-secret-value --secret-id "$1" --query SecretString --output text
          }

          DATABASE_URL=$(get_secret "${NAME_PREFIX}/database-url")
          NEXTAUTH_SECRET=$(get_secret "${NAME_PREFIX}/nextauth-secret")
          ENTRA_CLIENT_SECRET=$(get_secret "${NAME_PREFIX}/entra-client-secret")
          CREDENTIAL_ENCRYPTION_KEY=$(get_secret "${NAME_PREFIX}/credential-encryption-key")

          # The Bedrock contract values are not secrets and not Terraform outputs:
          # they live in the api task definition's environment (workload locals),
          # empty in byo-api mode. Read them from the running definition.
          API_ENV=$(aws ecs describe-task-definition --task-definition "${NAME_PREFIX}-api" \
            --query 'taskDefinition.containerDefinitions[?name==`cna-api`] | [0].environment' --output json 2>/dev/null || echo '[]')
          task_env() { echo "$API_ENV" | jq -r --arg n "$1" '.[] | select(.name == $n) | .value // empty'; }
          CNA_AI_MODE=$(task_env CNA_AI_MODE)
          CNA_BEDROCK_MODEL_ID=$(task_env CNA_BEDROCK_MODEL_ID)
          CNA_BEDROCK_INFERENCE_PROFILE_ARN=$(task_env CNA_BEDROCK_INFERENCE_PROFILE_ARN)

          cat > .env.${{ inputs.environment }} <<EOF
          # CNA Platform — environment variables (generated ${{ inputs.environment }})
          # Generated by 340-sync-keys.yml on $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # This file is a 1-day artifact. Do NOT commit it to git.

          # ─── AWS ──────────────────────────────────────────────────────────────
          AWS_REGION=${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}
          CNA_APPLIANCE_CLOUD=aws

          # ─── GenAI Engine (Amazon Bedrock in saas; BYO keys in the app UI) ────
          CNA_AI_MODE=${CNA_AI_MODE}
          CNA_AI_ENGINE_DEFAULT=${{ vars.CNA_AI_ENGINE_DEFAULT }}
          CNA_BEDROCK_MODEL_ID=${CNA_BEDROCK_MODEL_ID}
          CNA_BEDROCK_INFERENCE_PROFILE_ARN=${CNA_BEDROCK_INFERENCE_PROFILE_ARN}
          CNA_AZURE_MCP_ENDPOINT=${{ vars.CNA_AZURE_MCP_ENDPOINT }}
          CNA_AZURE_MCP_TRANSPORT=${{ vars.CNA_AZURE_MCP_TRANSPORT }}
          CNA_AWS_MCP_ENDPOINT=${{ vars.CNA_AWS_MCP_ENDPOINT }}
          CNA_AWS_MCP_TRANSPORT=${{ vars.CNA_AWS_MCP_TRANSPORT }}
          CNA_DRAWIO_MCP_URL=${{ vars.CNA_DRAWIO_MCP_URL }}

          # ─── Database ─────────────────────────────────────────────────────────
          DATABASE_URL=${DATABASE_URL}

          # ─── NextAuth ─────────────────────────────────────────────────────────
          NEXTAUTH_URL=${{ vars.CNA_NEXTAUTH_URL }}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

          # ─── Entra ID ─────────────────────────────────────────────────────────
          AZURE_AD_CLIENT_ID=${{ vars.CNA_ENTRA_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
          AZURE_AD_TENANT_ID=${{ vars.CNA_ENTRA_TENANT_ID }}

          # ─── BYO credential encryption ────────────────────────────────────────
          CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
          EOF

          echo "Generated .env.${{ inputs.environment }}"

      - name: Upload .env artifact (1-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: env-${{ inputs.environment }}-${{ github.run_id }}
          path: .env.${{ inputs.environment }}
          retention-days: 1

      - name: Summary
        run: |
          echo "## Env Sync Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`env-${{ inputs.environment }}-${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ The artifact contains secrets and expires in **1 day**." >> "$GITHUB_STEP_SUMMARY"
