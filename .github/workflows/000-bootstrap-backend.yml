name: "000 · Bootstrap Backend"
# First application bootstrap workflow. Run this before any Terraform-backed
# deploy in the target account.
# Provisions the Terraform remote backend — a versioned, SSE-KMS,
# public-access-blocked S3 bucket and a DynamoDB lock table — and initialises
# the selected environment's platform state against it. The setup script
# (scripts/Initialize-CnaAwsGitHubSecrets.ps1) writes the TFSTATE_* / AWS_REGION*
# GitHub Variables ahead of time; this workflow confirms them and is idempotent
# against what the script already created.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      region:
        description: AWS region for the state backend and the environment
        required: true
        default: us-east-1
        type: string
      region_short:
        description: Short region code used in resource names (e.g. use1)
        required: true
        default: use1
        type: string
      tfstate_bucket:
        description: S3 bucket for Terraform state (versioning + SSE-KMS); globally unique
        required: true
        type: string
      tfstate_lock_table:
        description: DynamoDB table for state locking (LockID partition key)
        required: true
        default: cna-tfstate-lock
        type: string

permissions:
  id-token: write
  contents: read

# Bootstrap creates shared backend state — never let two runs race to create the
# same bucket / table. Serialize by environment and do not cancel an in-flight
# run (a half-created backend is worse than a queued one).
concurrency:
  group: bootstrap-backend-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: true
      AWS_REGION: ${{ inputs.region }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Validate PostgreSQL password is set
        env:
          PG_PASSWORD: ${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}
        run: |
          if [ -z "$PG_PASSWORD" ]; then
            echo "::error::CNA_POSTGRES_ADMIN_PASSWORD secret is not set."
            exit 1
          fi
          if echo "$PG_PASSWORD" | grep -qP '[@:/?#%\[\]]'; then
            echo "::notice::CNA_POSTGRES_ADMIN_PASSWORD contains URL-special characters -- they will be percent-encoded by Terraform urlencode() in the connection string."
          fi
          echo "Password: OK"

      - name: Resolve bootstrap targets
        run: |
          echo "NAME_PREFIX=cna-${{ inputs.environment }}-${{ inputs.region_short }}" >> "$GITHUB_ENV"
          echo "TFSTATE_BUCKET=${{ inputs.tfstate_bucket }}" >> "$GITHUB_ENV"
          echo "TFSTATE_LOCK_TABLE=${{ inputs.tfstate_lock_table }}" >> "$GITHUB_ENV"
          echo "TFSTATE_KEY=${{ inputs.environment }}/platform.tfstate" >> "$GITHUB_ENV"

      - name: Verify target account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          EXPECTED_ACCOUNT_ID="${{ vars.AWS_TARGET_ACCOUNT_ID }}"
          echo "Authenticated as $CALLER_ARN in account $ACCOUNT_ID ($AWS_REGION)"
          if [[ -n "$EXPECTED_ACCOUNT_ID" && "$EXPECTED_ACCOUNT_ID" != "none" && "$EXPECTED_ACCOUNT_ID" != "$ACCOUNT_ID" ]]; then
            echo "::error::Authenticated to account $ACCOUNT_ID, but AWS_TARGET_ACCOUNT_ID expects $EXPECTED_ACCOUNT_ID"
            exit 1
          fi
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      # The Azure version creates the workload and tfstate resource groups here;
      # AWS has no resource-group container, so the backend is the whole job.
      - name: Create state bucket
        run: |
          if aws s3api head-bucket --bucket "$TFSTATE_BUCKET" 2>/dev/null; then
            echo "State bucket '$TFSTATE_BUCKET' already exists; skipping creation."
          else
            CREATE_ARGS=(--bucket "$TFSTATE_BUCKET" --object-ownership BucketOwnerEnforced)
            # us-east-1 rejects an explicit LocationConstraint; every other region requires one.
            if [ "$AWS_REGION" != "us-east-1" ]; then
              CREATE_ARGS+=(--create-bucket-configuration "LocationConstraint=$AWS_REGION")
            fi
            for attempt in $(seq 1 10); do
              if aws s3api create-bucket "${CREATE_ARGS[@]}" > /dev/null; then
                echo "State bucket '$TFSTATE_BUCKET' created successfully."
                break
              fi
              if [[ "$attempt" == "10" ]]; then
                echo "::error::State bucket creation failed after $attempt attempts."
                exit 1
              fi
              echo "Bucket creation failed on attempt $attempt; waiting for propagation..."
              sleep 15
            done
          fi
          # Hardening is applied on every run so an existing bucket converges too:
          # versioning (state history), SSE-KMS with a bucket key, no public access.
          aws s3api put-bucket-versioning --bucket "$TFSTATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$TFSTATE_BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"aws:kms"},"BucketKeyEnabled":true}]}'
          aws s3api put-public-access-block --bucket "$TFSTATE_BUCKET" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          echo "Bucket hardening applied."

      - name: Create lock table
        run: |
          if aws dynamodb describe-table --table-name "$TFSTATE_LOCK_TABLE" --query 'Table.TableStatus' --output text >/dev/null 2>&1; then
            echo "Lock table '$TFSTATE_LOCK_TABLE' already exists; skipping creation."
          else
            aws dynamodb create-table \
              --table-name "$TFSTATE_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --sse-specification Enabled=true,SSEType=KMS \
              --tags Key=Project,Value=cna > /dev/null
            echo "Lock table '$TFSTATE_LOCK_TABLE' created; waiting for ACTIVE..."
          fi
          aws dynamodb wait table-exists --table-name "$TFSTATE_LOCK_TABLE"
          echo "Lock table ACTIVE."

      - name: Terraform init for bootstrap state
        working-directory: infra/terraform/environments/${{ inputs.environment }}/platform
        run: |
          for attempt in $(seq 1 10); do
            if terraform init \
              -backend-config="bucket=$TFSTATE_BUCKET" \
              -backend-config="dynamodb_table=$TFSTATE_LOCK_TABLE" \
              -backend-config="region=$AWS_REGION" \
              -backend-config="encrypt=true" \
              -backend-config="key=$TFSTATE_KEY"; then
              exit 0
            fi
            if [[ "$attempt" == "10" ]]; then
              echo "::error::terraform init failed after $attempt attempts."
              exit 1
            fi
            echo "terraform init failed on attempt $attempt; waiting for IAM/S3 propagation..."
            sleep 15
          done

      # The Azure version imports the pre-created workload resource group into
      # state here. The AWS roots create every resource themselves, so the only
      # thing to confirm is that the backend answers for the state key.
      - name: Confirm backend state key is readable
        working-directory: infra/terraform/environments/${{ inputs.environment }}/platform
        run: |
          if terraform state list > /dev/null 2>&1; then
            COUNT=$(terraform state list | wc -l | tr -d ' ')
            echo "Backend readable; $COUNT resource(s) already tracked under $TFSTATE_KEY."
          else
            echo "Backend readable; no state under $TFSTATE_KEY yet (greenfield)."
          fi

      - name: Confirm the repository variables match
        env:
          VAR_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          VAR_TABLE: ${{ vars.TFSTATE_LOCK_TABLE }}
          VAR_REGION: ${{ vars.AWS_REGION }}
          VAR_REGION_SHORT: ${{ vars.AWS_REGION_SHORT }}
        run: |
          MISMATCH=0
          check() {
            local NAME="$1" EXPECTED="$2" ACTUAL="$3"
            if [ -z "$ACTUAL" ]; then
              echo "::warning::Repository variable $NAME is not set; expected '$EXPECTED' (scripts/Initialize-CnaAwsGitHubSecrets.ps1 writes it)."
              MISMATCH=1
            elif [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::warning::Repository variable $NAME is '$ACTUAL' but this run used '$EXPECTED'."
              MISMATCH=1
            else
              echo "$NAME = $ACTUAL ✅"
            fi
          }
          check TFSTATE_BUCKET "$TFSTATE_BUCKET" "$VAR_BUCKET"
          check TFSTATE_LOCK_TABLE "$TFSTATE_LOCK_TABLE" "$VAR_TABLE"
          check AWS_REGION "$AWS_REGION" "$VAR_REGION"
          check AWS_REGION_SHORT "${{ inputs.region_short }}" "$VAR_REGION_SHORT"
          if [ "$MISMATCH" = "1" ]; then
            echo "::warning::Set the variables listed in the summary before running any other workflow."
          fi

      - name: Summary
        run: |
          echo "## Bootstrap Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target account: \`$ACCOUNT_ID\` (\`$AWS_REGION\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Initialized Terraform environment: \`${{ inputs.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Name prefix: \`$NAME_PREFIX\`" >> "$GITHUB_STEP_SUMMARY"
          echo "State key: \`$TFSTATE_KEY\` (workload uses \`${{ inputs.environment }}/workload.tfstate\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set these GitHub Actions **Variables** before running any other workflow:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variable | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`TFSTATE_BUCKET\` | \`$TFSTATE_BUCKET\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`TFSTATE_LOCK_TABLE\` | \`$TFSTATE_LOCK_TABLE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`AWS_REGION\` | \`$AWS_REGION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`AWS_REGION_SHORT\` | \`${{ inputs.region_short }}\` |" >> "$GITHUB_STEP_SUMMARY"
