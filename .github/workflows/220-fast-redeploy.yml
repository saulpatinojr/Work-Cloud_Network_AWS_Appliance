name: "220 · Fast Redeploy"
# Fast image update without a full Terraform apply.
# Use this when you only need to roll out a new container image to
# one or more ECS services — no infrastructure changes.
# ~3 minutes vs ~10+ minutes for a full Terraform deploy.
# Prerequisite:
#   AWS infrastructure must already be deployed by workflow 210.
# Like the Azure version it bypasses Terraform and the release catalog: the
# new task-definition revision is registered here, so the next 210 plan will
# show the service's task definition drifting back to the Terraform-declared
# image. Follow with a real 210 release.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      cluster:
        description: ECS cluster name override (defaults to cna-<env>-<region_short>)
        required: false
        default: ""
        type: string
      api_image:
        description: API image reference (empty = leave unchanged)
        required: false
        default: ""
        type: string
      worker_image:
        description: Worker image reference (empty = leave unchanged)
        required: false
        default: ""
        type: string
      web_image:
        description: Web image reference (empty = leave unchanged)
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

# Serialize redeploys per environment so two overlapping runs don't race to
# register task-definition revisions for the same service; don't cancel an
# in-flight rollout.
concurrency:
  group: fast-redeploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      # Inputs reach the shell only through env (never expanded into the script).
      - name: Validate — at least one image must be specified
        env:
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
        run: |
          if [ -z "$INPUT_API_IMAGE" ] && \
             [ -z "$INPUT_WORKER_IMAGE" ] && \
             [ -z "$INPUT_WEB_IMAGE" ]; then
            echo "::error::At least one image (api_image, worker_image, or web_image) must be specified."
            exit 1
          fi

      # The Azure version needs no checkout (az does it all); the ECS roll is a
      # script under scripts/ci so the three service steps stay one line each.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Names are deterministic from the Terraform locals: cluster
      # <prefix>-cluster, services <prefix>-{api,worker,web}, containers
      # cna-{api,worker,web}, with prefix cna-<env>-<region_short>. The cluster
      # input overrides the derived name only — the service names follow it.
      - name: Derive ECS names from environment
        id: names
        env:
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_CLUSTER: ${{ inputs.cluster }}
          REGION_SHORT: ${{ vars.AWS_REGION_SHORT }}
        run: |
          if [ -z "$REGION_SHORT" ]; then
            echo "::error::AWS_REGION_SHORT repository variable is required (scripts/Initialize-CnaAwsGitHubSecrets.ps1 writes it)."
            exit 1
          fi
          PREFIX="cna-${INPUT_ENV}-${REGION_SHORT}"
          if [ -n "$INPUT_CLUSTER" ]; then
            CLUSTER="$INPUT_CLUSTER"
          else
            CLUSTER="${PREFIX}-cluster"
          fi
          echo "cluster=${CLUSTER}"              >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}"                >> "$GITHUB_OUTPUT"
          echo "api_service=${PREFIX}-api"       >> "$GITHUB_OUTPUT"
          echo "worker_service=${PREFIX}-worker" >> "$GITHUB_OUTPUT"
          echo "web_service=${PREFIX}-web"       >> "$GITHUB_OUTPUT"

      # `az containerapp update --image` becomes: read the service's current
      # task definition, swap the application container's image, register it as
      # a new revision (tagged so the deploy role's tag-scoped ecs:* covers the
      # service update), and point the service at it with a forced deployment.
      - name: Update cna-api image
        if: inputs.api_image != ''
        env:
          IMAGE: ${{ inputs.api_image }}
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.api_service }}
          CONTAINER: cna-api
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ecs_update_image.sh"

      - name: Update cna-worker image
        if: inputs.worker_image != ''
        env:
          IMAGE: ${{ inputs.worker_image }}
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.worker_service }}
          CONTAINER: cna-worker
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ecs_update_image.sh"

      - name: Update cna-web image
        if: inputs.web_image != ''
        env:
          IMAGE: ${{ inputs.web_image }}
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.web_service }}
          CONTAINER: cna-web
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ecs_update_image.sh"

      - name: Verify cna-web health after update
        if: inputs.web_image != ''
        env:
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.web_service }}
          PREFIX: ${{ steps.names.outputs.prefix }}
        run: |
          echo "Waiting for $SERVICE to reach a steady state..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" \
            || echo "::warning::$SERVICE did not stabilize within the waiter window."
          # The public entry point is the CloudFront distribution in front of
          # the ALB; find it by the ALB it fronts. No custom domain is assumed.
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "${PREFIX}-alb" \
            --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || echo "")
          EDGE_HOST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?DomainName=='${ALB_DNS}']].DomainName | [0]" \
            --output text 2>/dev/null || echo "")
          if [ -z "$EDGE_HOST" ] || [ "$EDGE_HOST" = "None" ]; then
            echo "::warning::No CloudFront distribution found in front of $ALB_DNS; skipping the HTTP health probe."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://${EDGE_HOST}/api/health" || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::cna-web /api/health returned $STATUS — check the /ecs/${PREFIX}/web log group for errors."
          fi

      - name: Summary
        env:
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
          API_SERVICE: ${{ steps.names.outputs.api_service }}
          WORKER_SERVICE: ${{ steps.names.outputs.worker_service }}
          WEB_SERVICE: ${{ steps.names.outputs.web_service }}
        run: |
          echo "## Refresh Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| ECS service | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$INPUT_API_IMAGE" ]; then
            echo "| \`${API_SERVICE}\` | \`${INPUT_API_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$INPUT_WORKER_IMAGE" ]; then
            echo "| \`${WORKER_SERVICE}\` | \`${INPUT_WORKER_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$INPUT_WEB_IMAGE" ]; then
            echo "| \`${WEB_SERVICE}\` | \`${INPUT_WEB_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform and the release catalog were bypassed — follow with a real \`210 · Deploy\`." >> "$GITHUB_STEP_SUMMARY"
