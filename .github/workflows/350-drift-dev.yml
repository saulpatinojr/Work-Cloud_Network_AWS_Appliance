name: "350 · Drift Detection · dev"
# The daily schedule is enabled once dev has been deployed for the first time
# (TODO.md T-102): a scheduled scan against an environment that does not exist
# would fail every day and tell nobody anything. Uncomment the `schedule`
# trigger after the first green 210 run for dev — the Azure appliance runs at
# `0 11 * * *`.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 11 * * *'

permissions:
  id-token: write
  contents: read

# Skip a scheduled drift scan if a prior one (or a manual dispatch) is still
# running — overlapping drift plans against the same state are redundant.
concurrency:
  group: drift-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_REGION_SHORT: ${{ vars.AWS_REGION_SHORT }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve Terraform backend targets
        run: |
          if [[ -z "${{ vars.TFSTATE_BUCKET }}" || -z "${{ vars.TFSTATE_LOCK_TABLE }}" || -z "$AWS_REGION" || -z "$AWS_REGION_SHORT" ]]; then
            echo "::error::TFSTATE_BUCKET, TFSTATE_LOCK_TABLE, AWS_REGION and AWS_REGION_SHORT repository variables are required."
            exit 1
          fi
          echo "TFSTATE_BUCKET=${{ vars.TFSTATE_BUCKET }}" >> "$GITHUB_ENV"
          echo "TFSTATE_LOCK_TABLE=${{ vars.TFSTATE_LOCK_TABLE }}" >> "$GITHUB_ENV"

      # ── Platform state drift ────────────────────────────────────────────────
      - name: Terraform init (platform)
        working-directory: infra/terraform/environments/dev/platform
        run: |
          terraform init \
            -backend-config="bucket=$TFSTATE_BUCKET" \
            -backend-config="dynamodb_table=$TFSTATE_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="key=dev/platform.tfstate"

      # The AWS platform root declares no ai_mode (no firewall egress rule to
      # open); region and short code are the only inputs it takes from CI.
      - name: Terraform drift plan (platform)
        working-directory: infra/terraform/environments/dev/platform
        run: |
          # -detailed-exitcode: 0 = clean, 2 = drift (warn), anything else = the
          # plan itself failed and must fail the job, never be read as "no drift".
          EXIT=0
          terraform plan -detailed-exitcode \
            -var="region=$AWS_REGION" \
            -var="region_short=$AWS_REGION_SHORT" \
            || EXIT=$?
          if [ "$EXIT" -eq 2 ]; then
            echo "::warning::Drift detected in dev/platform state."
          elif [ "$EXIT" -ne 0 ]; then
            echo "::error::terraform plan failed for dev/platform (exit $EXIT)."
            exit "$EXIT"
          fi

      # ── Workload state drift ────────────────────────────────────────────────
      - name: Terraform init (workload)
        working-directory: infra/terraform/environments/dev/workload
        run: |
          terraform init \
            -backend-config="bucket=$TFSTATE_BUCKET" \
            -backend-config="dynamodb_table=$TFSTATE_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="key=dev/workload.tfstate"

      # Secrets Manager and S3 are IAM-gated, not IP-firewalled, so there is no
      # runner allow-list window to open here (the Azure version's Key Vault and
      # storage-account steps) and none to remove at the end.
      - name: Terraform drift plan (workload)
        working-directory: infra/terraform/environments/dev/workload
        # Secrets passed via TF_VAR_* env so they never appear in the process
        # listing / logs (unlike -var= on the command line).
        env:
          TF_VAR_db_admin_password: ${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_entra_client_secret: ${{ secrets.CNA_ENTRA_CLIENT_SECRET }}
          TF_VAR_nextauth_secret: ${{ secrets.CNA_NEXTAUTH_SECRET }}
          TF_VAR_dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          TF_VAR_credential_encryption_key: ${{ secrets.CNA_CREDENTIAL_ENCRYPTION_KEY }}
          TF_VAR_github_token: ""
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

          optional_var() {
            local VALUE="$1"
            if [[ -z "$VALUE" || "$VALUE" == "none" ]]; then
              echo ""
            else
              echo "$VALUE"
            fi
          }
          # Drift must be measured against what was actually deployed, not the
          # floating tags or the current repo variables: the release catalog
          # written by the deploy workflow is the source of truth for the image
          # references and the ai_mode this environment was applied with.
          CATALOG="$GITHUB_WORKSPACE/.deployment-catalog/dev/latest.json"
          catalog_value() {
            local KEY="$1" FALLBACK="$2"
            if [ -f "$CATALOG" ]; then
              local V
              V=$(jq -r "$KEY // empty" "$CATALOG")
              if [ -n "$V" ]; then echo "$V"; return; fi
            fi
            echo "$FALLBACK"
          }
          API_IMAGE=$(catalog_value '.api_image' "docker.io/${DOCKERHUB_NAMESPACE}/cna:api-latest")
          WORKER_IMAGE=$(catalog_value '.worker_image' "docker.io/${DOCKERHUB_NAMESPACE}/cna:worker-latest")
          WEB_IMAGE=$(catalog_value '.web_image' "docker.io/${DOCKERHUB_NAMESPACE}/cna:web-latest")
          AI_MODE=$(catalog_value '.ai_mode' "saas")
          AI_ENGINE_DEFAULT=$(optional_var "${{ vars.CNA_AI_ENGINE_DEFAULT }}")
          if [ "$AI_MODE" = "byo-api" ]; then
            case "$AI_ENGINE_DEFAULT" in anthropic|openai) ;; *) AI_ENGINE_DEFAULT="anthropic" ;; esac
          else
            AI_ENGINE_DEFAULT="bedrock"
          fi
          AZURE_MCP_ENDPOINT=$(optional_var "${{ vars.CNA_AZURE_MCP_ENDPOINT }}")
          AZURE_MCP_TRANSPORT=$(optional_var "${{ vars.CNA_AZURE_MCP_TRANSPORT }}")
          AWS_MCP_ENDPOINT=$(optional_var "${{ vars.CNA_AWS_MCP_ENDPOINT }}")
          AWS_MCP_TRANSPORT=$(optional_var "${{ vars.CNA_AWS_MCP_TRANSPORT }}")
          DRAWIO_MCP_URL=$(optional_var "${{ vars.CNA_DRAWIO_MCP_URL }}")

          # The AWS workload takes the platform outputs as variables (Azure looks
          # the network up by name), so read them from the platform state.
          PLATFORM_OUT=$(terraform -chdir=../platform output -json)
          tf_out() { echo "$PLATFORM_OUT" | jq -r --arg k "$1" '.[$k].value // empty'; }
          tf_out_json() { echo "$PLATFORM_OUT" | jq -c --arg k "$1" '.[$k].value // []'; }
          if [ -z "$(tf_out vpc_id)" ]; then
            echo "::error::Platform state has no vpc_id output — has 210 · Deploy run for dev?"
            exit 1
          fi

          terraform plan -detailed-exitcode \
            -var="region=$AWS_REGION" \
            -var="region_short=$AWS_REGION_SHORT" \
            -var="vpc_id=$(tf_out vpc_id)" \
            -var="public_subnet_ids=$(tf_out_json public_subnet_ids)" \
            -var="app_subnet_ids=$(tf_out_json app_subnet_ids)" \
            -var="database_subnet_ids=$(tf_out_json database_subnet_ids)" \
            -var="alb_security_group_id=$(tf_out alb_security_group_id)" \
            -var="app_security_group_id=$(tf_out app_security_group_id)" \
            -var="database_security_group_id=$(tf_out database_security_group_id)" \
            -var="api_image=${API_IMAGE}" \
            -var="worker_image=${WORKER_IMAGE}" \
            -var="web_image=${WEB_IMAGE}" \
            -var="entra_tenant_id=${{ vars.CNA_ENTRA_TENANT_ID }}" \
            -var="entra_client_id=${{ vars.CNA_ENTRA_CLIENT_ID }}" \
            -var="nextauth_url=${{ vars.CNA_NEXTAUTH_URL }}" \
            -var="dockerhub_username=${{ vars.DOCKERHUB_NAMESPACE }}" \
            -var="ai_mode=${AI_MODE}" \
            -var="ai_engine_default=${AI_ENGINE_DEFAULT}" \
            -var="azure_mcp_endpoint=${AZURE_MCP_ENDPOINT}" \
            -var="azure_mcp_transport=${AZURE_MCP_TRANSPORT:-streamable-http}" \
            -var="aws_mcp_endpoint=${AWS_MCP_ENDPOINT}" \
            -var="aws_mcp_transport=${AWS_MCP_TRANSPORT:-streamable-http}" \
            -var="drawio_mcp_url=${DRAWIO_MCP_URL}" \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repository=${GITHUB_REPOSITORY#*/}" \
            || EXIT=$?
          if [ "${EXIT:-0}" -eq 2 ]; then
            echo "::warning::Drift detected in dev/workload state."
          elif [ "${EXIT:-0}" -ne 0 ]; then
            echo "::error::terraform plan failed for dev/workload (exit $EXIT)."
            exit "$EXIT"
          fi
