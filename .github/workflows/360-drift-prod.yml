on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Blocked on AWS account setup
        run: |
          echo "::error::360-drift-prod cannot run yet: there is no state backend to init against (REVIEW.md R-002) and no OIDC role to assume (R-003)."
          echo "::error::When there is, this job plans platform then workload with -detailed-exitcode against the images and ai_mode recorded in .deployment-catalog/prod/latest.json and warns on drift. Implementation: TODO.md T-102."
