# Pre-commit hooks — run on every git commit
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# All hooks are pinned to SHA (supply chain security, consistent with CI workflow pins)

repos:
  # --- Secret detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret detection)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Vendored agent configuration only. `.claude/` and `.agents/` are
        # third-party security documentation packs full of example tokens, and
        # they contributed 413 of the 446 findings on the first readable scan —
        # noise that made the baseline untriageable and the hook unusable.
        # `.deployment-catalog/` holds build manifests whose image digests trip
        # the hex-entropy detector. These are the same directories
        # `pyproject.toml` excludes from ruff and
        # `scripts/validate_documentation_model.py` excludes from the
        # documentation model, on the same grounds: vendored configuration, not
        # project source (TODO.md T-411).
        #
        # `.env.example` used to be excluded here and deliberately is not any
        # more. Excluding it meant a real credential pasted into the template
        # would never be caught; its three placeholder findings are recorded in
        # the baseline instead, which still catches anything new.
        exclude: ^(\.claude|\.agents|\.codex|\.deployment-catalog)/

  # --- Python linting ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff format

  # --- General hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main]
        name: no direct commit to main
